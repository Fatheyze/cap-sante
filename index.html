/* ---------- sauvegarde locale + synchronisation (base privée de l'artifact) ---------- */
let COL=null,flushT=null,migrated=false;const dirty=new Set(),writing=new Set();
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function persist(key){saveLocal();if(!COL)return;dirty.add(key);setSync('wait');clearTimeout(flushT);flushT=setTimeout(flush,700)}
const bodyFor=k=>k==='meta'?state.meta:(state.days[k.slice(2)]||{});
async function flush(){let err=false,busy=false;
 for(const k of [...dirty]){if(writing.has(k)){busy=true;continue}dirty.delete(k);writing.add(k);
  try{await COL.doc(k).set(JSON.parse(JSON.stringify(bodyFor(k))))}catch(e){err=true;console.warn(e)}writing.delete(k)}
 if(dirty.size&&busy&&!err)flushT=setTimeout(flush,1500);setSync(err?'err':dirty.size?'wait':'ok')}
let syncState='local';
function setSync(s){syncState=s;const el=$('#sync');if(el)el.outerHTML=syncHtml()}
const syncHtml=()=>{const t={local:'Enregistré sur cet appareil',wait:'Enregistrement…',ok:'Synchronisé',err:'Synchronisation en échec, données gardées sur l’appareil',load:'Connexion…'}[syncState];
 return `<span id="sync" class="sync ${syncState==='ok'?'ok':syncState==='err'?'err':''}"><i></i>${t}</span>`};
async function initSync(){
 if(!window.claude||!window.claude.use)return;
 setSync('load');
 const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
 const id=user?await user.id():null;
 if(!db||!id){setSync('local');return}
 COL=db.collection('data/users/'+id);
 const t=setTimeout(()=>{if(syncState==='load')setSync('err')},10000);
 COL.onSnapshot(snap=>{let changed=false;
  for(const d of snap.docs){if(dirty.has(d.id)||writing.has(d.id))continue;const v=d.data();if(!v)continue;
   if(d.id==='meta'){const nv={...DEF_META(),...v};if(JSON.stringify(nv)!==JSON.stringify(state.meta)){state.meta=nv;changed=true}}
   else if(d.id.startsWith('d-')){const k=d.id.slice(2);if(JSON.stringify(v)!==JSON.stringify(state.days[k]||null)){state.days[k]=v;changed=true}}}
  if(!snap.metadata.fromCache){clearTimeout(t);
   if(!migrated){migrated=true;const ids=new Set(snap.docs.map(d=>d.id));if(!ids.has('meta'))persist('meta');for(const k in state.days)if(!ids.has('d-'+k))persist('d-'+k)}
   if(!dirty.size)setSync('ok')}
  if(changed){saveLocal();if(!$('#sheet').innerHTML)render()}
 },e=>{clearTimeout(t);setSync('err')});
}

function weightChart(){const pts=[{d:state.meta.startDate,w:+state.meta.startW},...Object.keys(state.days).filter(d=>state.days[d].w&&d!==state.meta.startDate).sort().map(d=>({d,w:+state.days[d].w}))];
 const W=340,H=170,L=34,R=10,T=10,B=24,goal=+state.meta.goalW;
 const t0=parse(pts[0].d).getTime(),t1=Math.max(parse(pts[pts.length-1].d).getTime(),t0+14*864e5);
 const ws=pts.map(p=>p.w).concat(goal);let lo=Math.floor(Math.min(...ws)-1),hi=Math.ceil(Math.max(...ws)+1);
 const x=t=>L+(t-t0)/(t1-t0)*(W-L-R),y=w=>T+(hi-w)/(hi-lo)*(H-T-B);
 const step=hi-lo>12?4:2;let grid='';for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
 const path=pts.map((p,i)=>(i?'L':'M')+x(parse(p.d).getTime()).toFixed(1)+','+y(p.w).toFixed(1)).join('');
 const lp=pts[pts.length-1];
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de poids">${grid}
 <line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--green)" stroke-dasharray="4 4"/><text x="${W-R}" y="${y(goal)-4}" text-anchor="end" font-size="10" fill="var(--green)">objectif ${goal} kg</text>

 ${pts.map(p=>`<circle cx="${x(parse(p.d).getTime())}" cy="${y(p.w)}" r="3" fill="var(--blue)"/>`).join('')}
 <circle cx="${x(parse(lp.d).getTime())}" cy="${y(lp.w)}" r="5.5" fill="var(--surface)" stroke="var(--blue)" stroke-width="2.5"/>
 <text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${fshort(pts[0].d)}</text><text x="${W-R}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--muted)">${fshort(ymd(new Date(t1)))}</text></svg>`}

/* ---------- minuteur de séance ---------- */
let tm={i:0,left:SESSION[0][1],run:false,iv:null,ac:null,lock:null};
function beep(f=880,ms=180){try{tm.ac=tm.ac||new (window.AudioContext||window.webkitAudioContext)();const o=tm.ac.createOscillator(),g=tm.ac.createGain();o.frequency.value=f;o.connect(g);g.connect(tm.ac.destination);g.gain.value=.15;o.start();o.stop(tm.ac.currentTime+ms/1000)}catch(e){}}
function sheetSession(){openSheet(`<div class="row between"><h2>Séance maison</h2><button class="icon" data-close="1" aria-label="Fermer">×</button></div><div id="tbox"></div>`);drawTimer()}
function drawTimer(){const s=SESSION[tm.i],nx=SESSION[tm.i+1],done=SESSION.slice(0,tm.i).reduce((a,b)=>a+b[1],0)+(s?s[1]-tm.left:0);
 if(!$('#tbox'))return;
 $('#tbox').innerHTML=tm.i>=SESSION.length?`<div class="timer"><div class="step">Séance terminée</div><p>30 minutes notées dans ta journée. Bravo !</p><button data-close="1">Fermer</button></div>`:
 `<div class="timer"><span class="eyebrow">Étape ${tm.i+1} / ${SESSION.length}</span><div class="step">${esc(s[0])}</div>
 <div class="clock">${Math.floor(tm.left/60)}:${pad(tm.left%60)}</div>
 <div class="meter a" style="width:100%"><div class="bar"><i style="width:${done/SESSION_TOTAL*100}%"></i></div></div>
 ${ui.duo&&s[2]?`<span class="chip o">Ta fille : ${esc(s[2])}</span>`:''}
 ${s[3]?`<a class="small" href="${yt(s[3])}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700">Voir l’exercice en vidéo</a>`:''}
 <span class="small muted">${nx?'Ensuite : '+esc(nx[0]):'Dernière étape'}</span>
 <div class="row" style="justify-content:center"><button class="icon" data-act="tprev" aria-label="Étape précédente">⏮</button><button class="orange" data-act="ttoggle" style="min-width:130px">${tm.run?'Pause':'Démarrer'}</button><button class="icon" data-act="tnext" aria-label="Étape suivante">⏭</button></div>
 <span class="small muted">Va à ton rythme. Pas de sauts pour toi. Si le genou fait mal, saute l’exercice. Arrête-toi en cas de douleur à la poitrine ou d’essoufflement fort.</span></div>`}
function tick(){tm.left--;if(tm.left<=3&&tm.left>0)beep(660,90);if(tm.left<=0){tm.i++;beep(990,250);if(tm.i>=SESSION.length){finishSession();return}tm.left=SESSION[tm.i][1]}drawTimer()}
async function startTimer(){tm.run=true;beep(880,120);clearInterval(tm.iv);tm.iv=setInterval(tick,1000);try{tm.lock=await navigator.wakeLock?.request('screen')}catch(e){}drawTimer()}
function stopTimer(){tm.run=false;clearInterval(tm.iv);try{tm.lock?.release()}catch(e){}tm.lock=null}
function finishSession(){stopTimer();const d=dayEdit(today());d.act=[...(d.act||[]),{type:'maison',min:30,duo:!!ui.duo}];persist('d-'+today());tm.i=SESSION.length;drawTimer();tm={...tm,i:0,left:SESSION[0][1]}}

function addFood(meal,f,g){const d=dayEdit(ui.date);d.food=[...(d.food||[]),{id:uid(),meal,fid:f.fid||f.id,name:f.name,g:+g,kcal:+f.kcal,prot:+f.prot}];persist('d-'+ui.date)}
document.addEventListener('click',ev=>{const b=ev.target.closest('button,[data-close]');if(!b)return;const D=b.dataset;
 if(D.close&&(ev.target===b||b.tagName==='BUTTON')){closeSheet();return}
 if(D.tab){go(D.tab);return}
 if(D.water){const d=dayEdit(today());const n=+D.water;d.water=d.water===n?n-1:n;persist('d-'+today());render();return}
 if(D.menu){ui.menuMeal=D.menu;render();return}
 if(D.menuGo){ui.menuMeal=D.menuGo;go('menus');return}
 if(D.shopmenu){const[k,i]=D.shopmenu.split(':');let n=0;MENUS[k][+i].i.forEach(([fid])=>{const f=foodById(fid);if(f&&fid!=='cafe'&&shopAdd(f.name.replace(/ \(.*\)$/,''),'Pour mes menus'))n++});persist('meta');toast(n?n+' article'+(n>1?'s':'')+' ajouté'+(n>1?'s':'')+' aux courses':'Déjà dans la liste');return}
 if(D.addmenu){const[k,i]=D.addmenu.split(':');const meal=k==='plaisir'?'coll':k;const save=ui.date;ui.date=today();
  menuItems(MENUS[k][+i]).forEach(e=>addFood(meal,e,e.g));if(k==='plaisir'){dayEdit(today()).plaisir=true;persist('d-'+today())}
  ui.date=save;toast('Ajouté au journal d’aujourd’hui');render();return}
 if(D.bread){const[k,n]=D.bread.split(':');const save=ui.date;ui.date=today();addFood(k,foodById('pain-complet'),35*+n);ui.date=save;toast(n+' tranche'+(n>1?'s':'')+' de pain notée'+(n>1?'s':''));render();return}
 if(D.add){sheetAdd(D.add);return}
 if(D.edit){const e=(day(ui.date).food||[]).find(x=>x.id===D.edit);if(e)sheetAdd(e.meal,e.id);return}
 if(D.del){const d=dayEdit(ui.date);d.food=(d.food||[]).filter(x=>x.id!==D.del);persist('d-'+ui.date);render();return}
 if(D.pick){addCtx.fid=D.pick;renderQty();return}
 if(D.portion){$('#qg').value=r0(+D.portion*(addCtx.f.ug||100));updQty();return}
 if(D.delact!==undefined){const d=dayEdit(ui.date);d.act=(d.act||[]).filter((_,i)=>i!==+D.delact);persist('d-'+ui.date);render();return}
 if(D.quick){const d=dayEdit(ui.date);d.act=[...(d.act||[]),{type:D.quick==='10'?'marche':'velo',min:+D.quick}];persist('d-'+ui.date);render();return}
 if(D.calday){ui.date=D.calday;render();return}
 if(D.editfood){sheetFood(D.editfood);return}
 if(D.fcat!==undefined){ui.foodCat=D.fcat;sheetFoods();return}
 if(D.savefood!==undefined){const name=$('#fn').value.trim(),kcal=+$('#fk').value,prot=+$('#fp').value;
  if(!name||!$('#fk').value){toast('Indique au moins le nom et les kcal');return}
  const id=D.savefood||'perso-'+uid();const base=FOODS0.find(f=>f.id===id);
  state.meta.foods={...state.meta.foods,[id]:{name,kcal,prot,unit:$('#fu').value.trim()||'portion',ug:+$('#fg').value||100,cat:base?base.cat:'Mes aliments'}};
  persist('meta');toast('Aliment enregistré');if(addCtx&&!D.savefood&&$('#sheet').innerHTML&&addCtx.fromAdd){const meal=addCtx.meal;sheetAdd(meal);addCtx.fid=id;renderQty()}else sheetFoods();return}
 if(D.delfood){const id=D.delfood;if(FOODS0.find(f=>f.id===id)){state.meta.hidden=[...new Set([...(state.meta.hidden||[]),id])]}else{const f={...state.meta.foods};delete f[id];state.meta.foods=f}persist('meta');sheetFoods();return}
 if(D.resetfood){const f={...state.meta.foods};delete f[D.resetfood];state.meta.foods=f;persist('meta');sheetFoods();return}
 if(D.delw){const d=dayEdit(D.delw);delete d.w;delete d.waist;persist('d-'+D.delw);render();return}
 if(D.dellab){state.meta.labs=(state.meta.labs||[]).filter(l=>l.id!==D.dellab);persist('meta');render();return}
 const A=D.act;if(!A)return;
 if(A==='prevday'){ui.date=addDays(ui.date,-1);render()}
 else if(A==='nextday'){if(ui.date<today())ui.date=addDays(ui.date,1);render()}
 else if(A==='gotoday'){ui.date=today();render()}
 else if(A==='settings')sheetSettings();
 else if(A==='foods'){addCtx=null;sheetFoods()}
 else if(A==='newfood'){const fromAdd=!!(addCtx&&$('#flist'));const meal=addCtx?.meal;sheetFood(null);if(fromAdd)addCtx={meal,fromAdd:true}}
 else if(A==='confirmadd'){const g=+$('#qg').value;if(!g){toast('Indique une quantité');return}
  if(addCtx.editId){const d=dayEdit(ui.date);d.food=d.food.map(x=>x.id===addCtx.editId?{...x,g}:x);persist('d-'+ui.date)}else addFood(addCtx.meal,{...addCtx.f,fid:addCtx.fid},g);
  closeSheet();toast('Noté')}
 else if(A==='plaisir'){dayEdit(today()).plaisir=true;persist('d-'+today());ui.menuMeal='plaisir';toast('Savoure-le !');go('menus')}
 else if(A==='qw'){const w=+String($('#qw').value).replace(',','.');if(!(w>30&&w<300)){toast('Poids invalide');return}dayEdit(today()).w=w;persist('d-'+today());toast('Pesée notée');render()}
 else if(A==='addw'){const w=+String($('#ww').value).replace(',','.'),d=$('#wd').value||today();if(!(w>30&&w<300)){toast('Poids invalide');return}const dd=dayEdit(d);dd.w=w;const t=+$('#wt').value;if(t)dd.waist=t;persist('d-'+d);toast('Pesée notée');render()}
 else if(A==='addlab'){const l={id:uid(),date:$('#ld').value||today(),ggt:$('#lg').value?+$('#lg').value:null,alat:$('#la').value?+$('#la').value:null,crp:$('#lc').value?+$('#lc').value:null};
  if(l.ggt==null&&l.alat==null&&l.crp==null){toast('Indique au moins une valeur');return}state.meta.labs=[...(state.meta.labs||[]),l];persist('meta');render()}
 else if(A==='addact'){const min=+$('#amin').value;if(!min){toast('Indique les minutes');return}const d=dayEdit(ui.date);d.act=[...(d.act||[]),{type:$('#atype').value,min}];persist('d-'+ui.date);
  toast(actMin(ui.date)>=30?'Défi du jour validé !':'Noté');render()}
 else if(A==='calprev'||A==='calnext'){const[y,m]=ui.calMonth.split('-').map(Number);const d=new Date(y,m-1+(A==='calnext'?1:-1),1);ui.calMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);render()}
 else if(A==='session'){tm={...tm,i:0,left:SESSION[0][1],run:false};sheetSession()}
 else if(A==='ttoggle'){tm.run?(stopTimer(),drawTimer()):startTimer()}
 else if(A==='tnext'){if(tm.i<SESSION.length-1){tm.i++;tm.left=SESSION[tm.i][1];drawTimer()}else finishSession()}
 else if(A==='tprev'){if(tm.i>0){tm.i--;}tm.left=SESSION[tm.i][1];drawTimer()}
 else if(A==='savesettings'){const m=state.meta;const n=(id,def)=>{const v=+$(id).value;return v>0?v:def};
  Object.assign(m,{kcal:n('#s-k',m.kcal),prot:n('#s-p',m.prot),startW:n('#s-sw',m.startW),goalW:n('#s-g',m.goalW),height:n('#s-h',m.height),water:Math.min(12,n('#s-w',m.water)),startDate:$('#s-sd').value||m.startDate});
  persist('meta');closeSheet();toast('Réglages enregistrés')}
 else if(A==='copybk'){const t=$('#bk');navigator.clipboard?.writeText(t.value).then(()=>toast('Copié'),()=>{t.select();toast('Texte sélectionné : copie-le')})||(t.select())}
 else if(A==='restore'){try{const s=JSON.parse($('#bk').value);if(!s.meta||!s.days)throw 0;state={meta:{...DEF_META(),...s.meta},days:s.days};persist('meta');for(const k in state.days)persist('d-'+k);closeSheet();toast('Données restaurées')}catch(e){toast('Texte de sauvegarde invalide')}}
 else if(A==='shopadd'){const v=$('#shopin').value.trim();if(!v)return;shopAdd(v,'Mes ajouts');persist('meta');render();setTimeout(()=>$('#shopin')?.focus(),0)}
 else if(A==='shopclean'){state.meta.shop=shop().filter(x=>!x.done);persist('meta');render()}
 else if(A==='shopreset'){state.meta.shop=baseShop();persist('meta');render()}
 else if(A==='faim'){hz={step:0};sheetFaim()}
 else if(A==='hzreal'){hz={step:1,kind:'real',i:Math.random()*FAIM.real.length|0};sheetFaim()}
 else if(A==='hzenvie'){hz={step:1,kind:'envie',i:Math.random()*FAIM.envie.length|0};sheetFaim()}
 else if(A==='hznext'){hz.i=(hz.i+1)%FAIM[hz.kind].length;sheetFaim()}
 else if(A==='hzfood'){hz={step:1,kind:'real',i:Math.random()*FAIM.real.length|0};sheetFaim()}
 else if(A==='hztimer'){startHzTimer()}
 else if(A==='hztake'){const o=FAIM[hz.kind][hz.i];const save=ui.date;ui.date=today();(o.f||[]).forEach(([fid,g])=>{const f=foodById(fid);if(f)addFood('coll',{...f,fid},g)});ui.date=save;
  if(o.walk){const d=dayEdit(today());d.act=[...(d.act||[]),{type:'marche',min:10}]}
  winFaim(o.f?'Noté dans ta collation. Bien joué !':'Bien joué !')}
 else if(A==='hzpass'){winFaim('Fringale surmontée. Bravo !')}
 else if(A==='dice'){ui.dice=1+Math.random()*6|0;render()}
 else if(A==='duonext'){ui.duoI=(ui.duoI||0)+1;render()}
 else if(A==='duodone'){const d=dayEdit(ui.date);d.act=[...(d.act||[]),{type:'autre',min:30,duo:true,label:'Défi duo'}];persist('d-'+ui.date);toast('Séance à deux notée. Bravo à vous deux !');render()}
 else if(A==='sugnext'){ui.sug=(ui.sug||0)+1;render()}
 else if(A==='sugeat'){const k=nextMeal(),list=MENUS[k],m=list[(ui.sug||0)%list.length];menuItems(m).forEach(e=>{const save=ui.date;ui.date=today();addFood(k,e,e.g);ui.date=save});toast('Ajouté au journal');render()}
});
document.addEventListener('click',ev=>{if(ev.target.classList?.contains('sheet'))closeSheet()});
document.addEventListener('input',ev=>{const t=ev.target;
 if(t.id==='fsearch')renderFList(t.value);
 if(t.id==='qg')updQty()});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.id==='fsel'&&t.value){addCtx.fid=t.value;renderQty()}
 if(t.dataset.day){const d=dayEdit(today());d[t.dataset.day]=t.checked;persist('d-'+today());render()}
 if(t.dataset.duo){ui.duo=t.checked;return}
 if(t.dataset.shop){state.meta.shop=shop().map(x=>x.id===t.dataset.shop?{...x,done:t.checked}:x);persist('meta');render()}});

render();
setTimeout(()=>initSync().catch(()=>setSync('local')),0);
</script>
